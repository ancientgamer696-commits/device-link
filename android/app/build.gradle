plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def dlKeystore = file("$projectDir/../keystore/release.keystore")

android {
    namespace 'com.santi.devicelink'
    compileSdk 34
    defaultConfig {
        applicationId 'com.santi.devicelink'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.4-proto'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }

    if (dlKeystore.exists()) {
        signingConfigs {
            dl {
                storeFile dlKeystore
                storePassword 'devicelink'
                keyPassword 'devicelink'
                keyAlias 'devicelink'
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (dlKeystore.exists()) signingConfig signingConfigs.dl
        }
    }
}
dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
