<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DeviceLink Remote</title>
<style>
:root{--bg:#0b0e14;--card:#141a26;--line:#232c3f;--tx:#e8eefc;--dim:#8b97ae;--acc:#37e0a6;--hot:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
body{display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bar{display:flex;gap:10px;align-items:center;width:100%;max-width:980px;font-size:12px;color:var(--dim);flex-wrap:wrap}
#bar b{color:var(--tx)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hot);display:inline-block}
.dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
#stage{width:100%;max-width:980px;aspect-ratio:9/16;max-height:72vh;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
#cv{width:100%;height:100%;display:block;cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px;text-align:center;padding:20px;background:#000a;pointer-events:none}
#ctl{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:980px;justify-content:center}
button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
button:active{transform:scale(.94);border-color:var(--acc)}
button.on{background:var(--acc);color:#04120b;border-color:var(--acc)}
.seg{display:flex;gap:0}.seg button{border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
#txt{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:14px;width:min(320px,60vw)}
#bri{width:150px;accent-color:var(--acc)}
#apps{display:none;flex-wrap:wrap;gap:6px;width:100%;max-width:980px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
#apps button{padding:6px 10px;font-size:12px;font-weight:500;border-radius:8px}
label{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="bar">
  <span><span class="dot" id="dot"></span> <b id="st">connecting…</b></span>
  <span id="dev"></span>
  <span>FPS <b id="fps">–</b></span><span>ping <b id="ping">–</b></span>
  <span id="tip">tap = touch · drag = swipe/scroll</span>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ov">Screen ka wait ho raha hai…<br>Phone app me <b>Start streaming</b> dabao.</div>
</div>

<div id="ctl">
  <div class="seg">
    <button onclick="key('back')">◀ Back</button>
    <button onclick="key('home')">⌂ Home</button>
    <button onclick="key('recents')">▢ Recent</button>
    <button onclick="key('notif')">☰ Shade</button>
  </div>
  <button id="camBtn" onclick="cam()">📷 Camera</button>
  <button onclick="shot()">⬇ Screenshot</button>
  <button onclick="wake()">☀ Wake</button>
  <button onclick="rot(0)">↻ Auto-rot off</button>
  <button onclick="rot(1)">↺ Lock</button>
  <button id="appsBtn" onclick="apps()">🗂 Apps</button>
  <label>🔆<input type="range" id="bri" min="10" max="100" value="60" onchange="send({t:'bri',v:Math.round(this.value*2.55)})"></label>
  <input id="txt" placeholder="type → phone pe paste" onkeydown="if(event.key==='Enter'){send({t:'text',v:this.value});}">
</div>
<div id="apps"></div>

<script>
var host = location.hostname;
if(!host){ host = prompt('Phone ka IP daalo (DeviceLink app me dikh raha hai, e.g. 192.168.1.23)') || '192.168.1.1'; }
var ws, meta={mode:'screen'}, img=new Image(), imgURL=null, frames=0, fpsT=performance.now(), connected=false;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');

function conn(){
  ws = new WebSocket('ws://'+host+':8765');
  ws.binaryType='arraybuffer';
  ws.onopen=function(){ connected=true; document.getElementById('dot').className='dot on'; document.getElementById('st').textContent='LIVE → '+host; };
  ws.onclose=function(){ connected=false; document.getElementById('dot').className='dot'; document.getElementById('st').textContent='reconnecting…'; setTimeout(conn,1500); };
  ws.onerror=function(){ ws.close(); };
  ws.onmessage=function(e){
    if(typeof e.data==='string'){
      var m=JSON.parse(e.data);
      if(m.t==='meta'){ meta=m; document.getElementById('dev').textContent=(m.model||'')+' · '+(m.w||'?')+'×'+(m.h||'?')+' · 🔋'+(m.battery!=null?m.battery+'%':'—')+' · '+(m.mode==='cam'?'CAMERA':'SCREEN');
        cv.width=m.w||cv.width; cv.height=m.h||cv.height;
        document.getElementById('camBtn').className = m.mode==='cam'?'on':'';
        var ov=document.getElementById('ov'); if(frames>0) ov.style.display='none';
      }
      else if(m.t==='pong'){ var dt=Date.now()-m.id; document.getElementById('ping').textContent=dt+'ms'; }
      else if(m.t==='appList'){ fillApps(m.a||[]); }
    } else {
      var blob=new Blob([e.data],{type:'image/jpeg'});
      if(imgURL) URL.revokeObjectURL(imgURL);
      imgURL=URL.createObjectURL(blob);
      img.onload=function(){
        if(cv.width!==img.naturalWidth||cv.height!==img.naturalHeight){
          var ar=img.naturalWidth/img.naturalHeight;
          if(ar<1){cv.width=540;cv.height=Math.round(540/ar);}else{cv.height=Math.round(540/ar);cv.width=540;}
        }
        ctx.drawImage(img,0,0,cv.width,cv.height);
        frames++;
        var now=performance.now(); if(now-fpsT>1000){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
        document.getElementById('ov').style.display='none';
      };
      img.src=imgURL;
    }
  };
}
conn();
setInterval(function(){ if(connected){ send({t:'ping',id:Date.now()}); send({t:'info'}); } },3000);

function send(o){ if(connected) ws.send(JSON.stringify(o)); }
function key(k){ send({t:'key',v:k}); }
function cam(){ send({t:'cam',on:(meta.mode!=='cam')}); }
function wake(){ send({t:'wake'}); }
function rot(v){ send({t:'rot',v:v}); }
function apps(){ send({t:'apps'}); document.getElementById('apps').style.display='block'; document.getElementById('apps').innerHTML='<span style="color:#8b97ae">loading apps…</span>'; }
function fillApps(a){
  var el=document.getElementById('apps'); el.style.display='block'; el.innerHTML='';
  if(!a.length){ el.innerHTML='<span style="color:#8b97ae">koi app visible nahi (Android package-visibility) — URL open use karo</span>'; return; }
  a.forEach(function(x){ var b=document.createElement('button'); b.textContent=x.n; b.onclick=function(){ send({t:'launch',pkg:x.p}); }; el.appendChild(b); });
}
function shot(){
  try{ var d=cv.toDataURL('image/jpeg',0.92); var a=document.createElement('a'); a.href=d; a.download='devicelink-'+Date.now()+'.jpg'; a.click(); }catch(e){ alert('snapshot: '+e); }
}

/* ---- touch injection ---- */
var down=false, pts=[], t0=0, lastMove=0;
function norm(ev){
  var r=cv.getBoundingClientRect();
  return [Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))];
}
cv.addEventListener('pointerdown',function(ev){ ev.preventDefault(); if(!connected)return; down=true; var p=norm(ev); pts=[p]; t0=Date.now(); send({t:'down',x:p[0],y:p[1]}); cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove',function(ev){ if(!down)return; var p=norm(ev); var now=Date.now(); if(now-lastMove>45){ lastMove=now; pts.push(p); send({t:'move',x:p[0],y:p[1]}); } });
cv.addEventListener('pointerup',function(ev){ if(!down)return; down=false; var p=norm(ev); send({t:'up',x:p[0],y:p[1]}); });
cv.addEventListener('pointercancel',function(){ if(down){ down=false; send({t:'up',x:pts[pts.length-1][0],y:pts[pts.length-1][1]}); } });
document.addEventListener('keydown',function(ev){
  if(ev.target.tagName==='INPUT')return;
  if(ev.key==='h')key('home'); if(ev.key==='b')key('back'); if(ev.key==='r')key('recents');
});
</script>
</body>
</html>
