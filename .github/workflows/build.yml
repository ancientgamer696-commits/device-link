name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Assemble debug APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: devicelink-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devicelink-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
          body: |
            DeviceLink prototype APK (debug-signed).
            Install on your own Redmi/Android 8+. LAN-only remote: viewer at http://<phone-ip>:8766
